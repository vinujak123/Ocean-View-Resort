<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Booking | Ocean View Resort</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:wght@700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="landing.css">
    <style>
        .manage-container {
            max-width: 800px;
            margin: 120px auto 60px;
            background: var(--white);
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        .search-box {
            display: flex;
            gap: 15px;
            margin-bottom: 40px;
        }

        .search-input {
            flex-grow: 1;
            padding: 15px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 16px;
            font-family: inherit;
        }

        .btn-search {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0 30px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-search:hover {
            background: var(--primary-dark);
        }

        /* Form Styles */
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 20px;
        }

        label {
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--secondary);
        }

        input,
        select {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-family: inherit;
        }

        .estimate-box {
            background: #f0f7ff;
            padding: 20px;
            border-radius: 4px;
            margin: 20px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .estimate-amount {
            font-size: 24px;
            font-weight: 700;
            color: #2563eb;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .btn-update {
            flex: 1;
            background: #059669;
            /* emerald-600 */
            color: white;
            padding: 15px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-update:hover {
            background: #047857;
            /* emerald-700 */
        }

        .btn-cancel {
            flex: 1;
            background: #e11d48;
            /* rose-600 */
            color: white;
            padding: 15px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-cancel:hover {
            background: #be123c;
            /* rose-700 */
        }

        .error-message {
            color: #e11d48;
            margin-top: 10px;
            font-weight: 500;
            text-align: center;
        }
    </style>
</head>

<body style="background-color: #fff9f0;">
    <nav style="background: var(--secondary);">
        <div class="logo">OCEAN VIEW</div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="rooms.html">Rooms</a>
            <a href="booking.html">Book Now</a>
        </div>
    </nav>

    <div class="manage-container">
        <h2 style="text-align: center; margin-bottom: 10px;">Manage Your Reservation</h2>
        <p style="text-align: center; color: #64748b; margin-bottom: 30px;">Enter your reference ID to view, update, or
            cancel your booking.</p>

        <form id="searchForm" class="search-box">
            <input type="text" id="refIdInput" class="search-input" placeholder="Enter Reference ID (e.g., 1001)"
                required>
            <input type="tel" id="verifyPhoneInput" class="search-input" placeholder="Enter Booking Phone Number"
                required>
            <button type="submit" class="btn-search">Find Booking</button>
        </form>
        <div id="searchError" class="error-message" style="display: none;"></div>

        <div id="manageSection" style="display: none;">
            <div style="padding-bottom: 20px; border-bottom: 1px solid #e2e8f0; margin-bottom: 30px;">
                <h3 style="color: #2563eb;">Booking <span id="displayRefId"></span></h3>
            </div>

            <form id="updateForm">
                <div class="form-group">
                    <label>Guest Name</label>
                    <input type="text" id="guestName" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="tel" id="phone" required>
                    </div>
                    <div class="form-group">
                        <label>Address</label>
                        <input type="text" id="address">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Room Category</label>
                        <select id="roomType">
                            <option value="STANDARD">Standard (LKR 15,000)</option>
                            <option value="DELUXE">Deluxe (LKR 25,000)</option>
                            <option value="SUITE">Suite (LKR 45,000)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Dining Plan</label>
                        <select id="boardType">
                            <option value="BB">Bed & Breakfast (Included)</option>
                            <option value="HB">Half Board (+ LKR 5,000)</option>
                            <option value="FB">Full Board (+ LKR 10,000)</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Arrival Date</label>
                        <input type="date" id="checkInDate" required>
                    </div>
                    <div class="form-group">
                        <label>Departure Date</label>
                        <input type="date" id="checkOutDate" required>
                    </div>
                </div>

                <div id="estimateBox" class="estimate-box">
                    <span style="font-weight: 600;">Current Total:</span>
                    <span id="estimateAmount" class="estimate-amount">LKR 0</span>
                </div>

                <div class="action-buttons">
                    <button type="submit" class="btn-update">Update Booking</button>
                    <button type="button" id="btnCancelBooking" class="btn-cancel">Cancel Booking</button>
                </div>
            </form>
        </div>
    </div>

    <script src="manage.js"></script>
</body>

</html>
